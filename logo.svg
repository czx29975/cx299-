    <g stroke-linecap="round" stroke-width="6.6">
      <path d="M32 58v16" stroke="#F6EFE1" opacity=".78"/>
      <path d="M48 51v30" stroke="url(#wmGold)"/>
      <path d="M64 58v16" stroke="#F6EFE1" opacity=".78"/>
    </g>
  </g>

  <!-- 字标 -->
  <text x="132" y="76" font-family="PingFang SC, HarmonyOS Sans SC, Microsoft YaHei, Noto Sans SC, sans-serif"
        font-size="46" font-weight="600" letter-spacing="6" fill="#1B2725">安语</text>
  <text x="134" y="104" font-family="PingFang SC, HarmonyOS Sans SC, Microsoft YaHei, Noto Sans SC, sans-serif"
        font-size="16" font-weight="400" letter-spacing="2.6" fill="#77827D">居家养老语音助手</text>
