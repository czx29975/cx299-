<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 安语</title>
<meta name="theme-color" content="#2C6653">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/login-page.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="安语">
</head>
<body class="login-body">
<main class="login-page">

  <!-- 左：品牌 -->
  <aside class="login-brand">
    <div class="lb-ripple" aria-hidden="true"><i></i><i></i><i></i></div>

    <div class="lb-top">
      <svg class="lb-logo" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M13.5 27.5 32 13.5 50.5 27.5" fill="none" stroke="currentColor" stroke-width="3.6"
              stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>
        <g stroke-linecap="round" stroke-width="4.4">
          <path d="M21.6 38.5v9.5" stroke="currentColor" opacity=".68"/>
          <path d="M32 34.5v18" stroke="#E8C07A"/>
          <path d="M42.4 38.5v9.5" stroke="currentColor" opacity=".68"/>
        </g>
      </svg>
      <span class="lb-name">安语<small>居家养老语音助手</small></span>
    </div>

    <div class="lb-main">
      <h2 class="lb-title">说一句话，<br>就有人知道。</h2>
      <p class="lb-sub">老人不用学操作，开口就行；家属和社区看到的是同一件事，不给彼此留空白。</p>
      <ul class="lb-list">
        <li><b>说话就能办</b><span>确认吃药、记血压、叫家人，不用点屏幕</span></li>
        <li><b>出事有人接</b><span>求助 60 秒无人接单，自动往上一级叫人</span></li>
        <li><b>数据留在自己家</b><span>用药与血压只在家人、社区之间流转</span></li>
      </ul>
    </div>

    <p class="lb-foot">安语 · 让牵挂有回应</p>
  </aside>

  <!-- 右：登录表单 -->
  <section class="login-form-side">
    <div class="login-card">
      <header class="lc-head">
        <h1 id="authTitle">登录</h1>
        <p class="lc-sub" id="authSub">老人、家属、社区共用一个入口</p>
      </header>

      <div class="tabs" role="tablist" aria-label="登录方式" id="modeTabs">
        <button class="tab on" type="button" role="tab" aria-selected="true" data-mode="pwd">密码登录</button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-mode="sms">短信验证码</button>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="phone">手机号</label>
          <div class="lf">
            <svg class="lf-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="6" y="2.5" width="12" height="19" rx="3"/>
              <path d="M10.6 18.6h2.8"/>
            </svg>
            <input id="phone" class="has-ico" type="tel" inputmode="numeric" autocomplete="username"
                   placeholder="11 位手机号" maxlength="11" required>
          </div>
        </div>

        <div class="field" id="pwdWrap">
          <label for="password" id="pwdLabel">密码</label>
          <div class="lf">
            <svg class="lf-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4.5" y="10.2" width="15" height="10.3" rx="2.4"/>
              <path d="M8.2 10.2V7.8a3.8 3.8 0 0 1 7.6 0v2.4"/>
            </svg>
            <input id="password" class="has-ico has-eye" type="password" autocomplete="current-password" placeholder="登录密码">
            <button class="lf-eye" type="button" id="eyeBtn" aria-label="显示密码" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2.6 12S6.1 5.9 12 5.9 21.4 12 21.4 12 17.9 18.1 12 18.1 2.6 12 2.6 12z"/>
                <circle cx="12" cy="12" r="2.7"/>
              </svg>
            </button>
          </div>
        </div>

        <div id="smsWrap" hidden>
          <div class="field">
            <label for="captcha">图形验证码</label>
            <div class="code-row">
              <input id="captcha" type="text" autocomplete="off" placeholder="右侧 4 位字符" maxlength="4">
              <button type="button" class="captcha-box" id="captchaBox" aria-label="换一张图形验证码">
                <span class="small muted">加载中…</span>
              </button>
            </div>
          </div>
          <div class="field">
            <label for="code">短信验证码</label>
            <div class="code-row">
              <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位数字" maxlength="6">
              <button class="btn btn-ghost" type="button" id="sendBtn">获取验证码</button>
            </div>
          </div>
        </div>

        <p class="lc-err" id="loginErr"></p>
        <button class="btn btn-primary btn-block btn-lg" type="submit" id="loginBtn">登录</button>
      </form>

      <p class="auth-foot" id="doneHint" hidden style="color:var(--primary)">设置已完成，用刚才的手机号登录即可。</p>

      <div class="lc-links">
        <a href="/register.html">注册新账号</a>
        <i aria-hidden="true"></i>
        <a href="#" id="forgotLink">忘记密码</a>
      </div>

      <p class="auth-foot">注册需短信验证 · 虚拟号不可用 · <a href="/setup.html">初始化向导</a></p>    </div>

    <p class="lc-note">健康信息仅用于家人与社区之间的照护协同，可随时撤回</p>
  </section>

</main>

<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>
<script src="/assets/api.js"></script>
<script src="/assets/login.js"></script>
</body>
</html>
