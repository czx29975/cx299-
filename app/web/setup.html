<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首次设置 · 安语</title>
<meta name="theme-color" content="#FBF8F2">
<link rel="stylesheet" href="/assets/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="安语">
</head>
<body>
<main class="auth-shell">
  <div class="auth-card" style="width:min(100%,42rem)">
    <div class="brand" style="margin-bottom:1rem">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H12l-4.5 4v-4H6.5A2.5 2.5 0 0 1 4 13.5z"/><path d="M9 10.5h.01M12 10.5h.01M15 10.5h.01"/></svg>
      </span>
      <span class="brand-text"><strong>安语</strong><small>首次设置</small></span>
    </div>

    <h1>先把家里的情况填一下</h1>
    <p class="lead">这些信息决定助手怎么称呼老人、什么时候提醒吃药、出事时通知谁。填完就能直接用，之后随时可以改。</p>

    <div class="steps" aria-hidden="true"><span class="on" id="s1"></span><span id="s2"></span><span id="s3"></span></div>

    <form id="setupForm" novalidate>
      <!-- 第一步 -->
      <section id="step1">
        <p class="step-title">第 1 步 / 共 3 步 · 老人信息</p>
        <div class="row">
          <div class="field">
            <label for="name">老人姓名</label>
            <input id="name" name="name" type="text" autocomplete="off" placeholder="王秀兰" required>
          </div>
          <div class="field">
            <label for="display">希望怎么称呼</label>
            <input id="display" name="display" type="text" autocomplete="off" placeholder="王阿姨">
            <span class="hint">助手会这样叫老人，比如「王阿姨」</span>
          </div>
        </div>
        <div class="row-3">
          <div class="field">
            <label for="age">年龄</label>
            <input id="age" name="age" type="number" min="40" max="120" placeholder="78">
          </div>
          <div class="field">
            <label for="bloodType">血型</label>
            <input id="bloodType" name="bloodType" type="text" placeholder="A 型">
          </div>
          <div class="field">
            <label for="community">所属社区</label>
            <input id="community" name="community" type="text" placeholder="建设路社区">
          </div>
        </div>
        <div class="field">
          <label for="address">住址</label>
          <input id="address" name="address" type="text" placeholder="XX 区 XX 路 12 号 3 单元 402">
          <span class="hint">急救和网格员上门要靠这个地址</span>
        </div>
        <div class="row">
          <div class="field">
            <label for="conditions">基础病</label>
            <input id="conditions" name="conditions" type="text" placeholder="高血压、2 型糖尿病">
          </div>
          <div class="field">
            <label for="allergies">过敏</label>
            <input id="allergies" name="allergies" type="text" placeholder="青霉素">
          </div>
        </div>
        <button class="btn btn-primary btn-block" type="button" data-next="2">下一步</button>
      </section>

      <!-- 第二步 -->
      <section id="step2" hidden>
        <p class="step-title">第 2 步 / 共 3 步 · 每天要吃的药</p>
        <p class="small muted" style="margin-bottom:.8rem">有几样填几样，留空也行；之后可以在社区端补。</p>
        <div id="medRows"></div>
        <button class="btn btn-ghost btn-sm" type="button" id="addMed">+ 再加一种药</button>
        <div class="row" style="margin-top:1.2rem">
          <button class="btn btn-ghost" type="button" data-back="1">上一步</button>
          <button class="btn btn-primary" type="button" data-next="3">下一步</button>
        </div>
      </section>

      <!-- 第三步 -->
      <section id="step3" hidden>
        <p class="step-title">第 3 步 / 共 3 步 · 三个账号</p>
        <p class="small muted" style="margin-bottom:.9rem">老人、家属、社区各一个账号，用手机号登录。密码至少 6 位，请记好。</p>

        <h3 style="font-size:.95rem;margin:.4rem 0 .6rem">老人账号</h3>
        <div class="row">
          <div class="field">
            <label for="elderPhone">手机号</label>
            <input id="elderPhone" type="tel" inputmode="numeric" placeholder="13800000001" required>
          </div>
          <div class="field">
            <label for="elderPwd">密码</label>
            <input id="elderPwd" type="password" placeholder="至少 6 位" required>
          </div>
        </div>

        <h3 style="font-size:.95rem;margin:1rem 0 .6rem">家属账号</h3>
        <div class="row-3">
          <div class="field">
            <label for="famName">姓名</label>
            <input id="famName" type="text" placeholder="李梅">
          </div>
          <div class="field">
            <label for="famRelation">关系</label>
            <input id="famRelation" type="text" placeholder="女儿">
          </div>
          <div class="field">
            <label for="famPhone">手机号</label>
            <input id="famPhone" type="tel" inputmode="numeric" placeholder="13800000002" required>
          </div>
        </div>
        <div class="field">
          <label for="famPwd">密码</label>
          <input id="famPwd" type="password" placeholder="至少 6 位" required>
        </div>

        <h3 style="font-size:.95rem;margin:1rem 0 .6rem">社区账号（网格员 / 值班员）</h3>
        <div class="row">
          <div class="field">
            <label for="comName">姓名</label>
            <input id="comName" type="text" placeholder="王建国">
          </div>
          <div class="field">
            <label for="comPhone">手机号</label>
            <input id="comPhone" type="tel" inputmode="numeric" placeholder="13800000003" required>
          </div>
        </div>
        <div class="field">
          <label for="comPwd">密码</label>
          <input id="comPwd" type="password" placeholder="至少 6 位" required>
        </div>

        <p class="small muted" id="setupErr" style="color:var(--danger);min-height:1.2rem"></p>
        <div class="row">
          <button class="btn btn-ghost" type="button" data-back="2">上一步</button>
          <button class="btn btn-primary" type="submit" id="submitBtn">完成设置</button>
        </div>
      </section>
    </form>

    <p class="auth-foot">数据保存在本机数据库，不上传任何第三方。</p>
  </div>
</main>
<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>
<script src="/assets/api.js"></script>
<script src="/assets/setup.js"></script>
</body>
</html>
