<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>社区值守台 · 安语</title>
<meta name="theme-color" content="#FBF8F2">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="安语">
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H12l-4.5 4v-4H6.5A2.5 2.5 0 0 1 4 13.5z"/><path d="M9 10.5h.01M12 10.5h.01M15 10.5h.01"/></svg>
      </span>
      <span class="brand-text"><strong>安语</strong><small>社区值守台</small></span>
    </a>
    <span class="topbar-spacer"></span>
    <div class="topbar-actions">
      <span class="tag tag-ok" id="liveTag">实时</span>
      <div class="who"><b id="whoName">—</b><span id="whoRole">社区端</span></div>
      <button class="btn btn-ghost btn-sm" type="button" id="dutyBtn">AI 值守<b id="dutyDot" style="display:none;width:6px;height:6px;border-radius:50%;background:var(--primary);margin-left:.3rem;vertical-align:middle"></b></button>
      <button class="btn btn-ghost btn-sm" type="button" id="alarmBtn" data-state="off" aria-live="polite">
        <span class="alarm-dot" aria-hidden="true"></span><b id="alarmBtnText">开启警报</b>
      </button>
      <button class="btn btn-ghost btn-sm" type="button" id="notifyBtn">通知</button>
      <button class="btn btn-ghost btn-sm" type="button" id="smsBtn">短信</button>
      <button class="btn btn-ghost btn-sm" type="button" id="llmBtn">大模型</button>
      <button class="btn btn-ghost btn-sm" type="button" id="usersBtn">成员</button>
      <button class="btn btn-ghost btn-sm" type="button" data-logout>退出</button>
    </div>
  </div>
</header>

<main id="main" class="page">
  <div class="wrap">
    <div class="page-head">
      <div>
        <p class="small muted" id="eyebrow">值守台</p>
        <h1 id="headline">正在加载…</h1>
        <p id="subline">工单来自老人端求助、语音主诉、用药超时与设备告警；接单后责任到人，全程留痕。</p>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" type="button" id="addElderBtn">新增老人</button>
        <button class="btn btn-primary btn-sm" type="button" id="refreshBtn">刷新</button>
      </div>
    </div>

    <div class="stat-grid" id="stats"></div>

    <div class="console-grid">
      <section class="card">
        <div class="tabs" role="tablist" aria-label="按状态筛选工单">
          <button class="tab on" role="tab" aria-selected="true" data-tab="pending">待接单<b id="nPending">0</b></button>
          <button class="tab" role="tab" aria-selected="false" data-tab="doing">处理中<b id="nDoing">0</b></button>
          <button class="tab" role="tab" aria-selected="false" data-tab="closed">已闭环<b id="nClosed">0</b></button>
        </div>
        <div class="order-list" id="orderList" aria-live="polite"></div>
        <p class="small muted" style="margin-top:.6rem">SOS 会立刻短信通知全部联系人；60 秒无人接单开始按顺位打电话（第 1 顺位 → 第 2 顺位 → 社区值班 → 全员循环），3 分钟未到场会建议转 120。</p>
      </section>

      <aside class="card" id="detailCard">
        <div class="card-head"><h2>工单详情</h2><span class="tag" id="detailTag">未选择</span></div>
        <div id="detailBody">
          <div class="empty">在左边选一条工单<br><span class="small">时间线、应急信息、处理动作都在这里</span></div>
        </div>
      </aside>
    </div>

    <section class="card" style="margin-top:1rem" id="rosterSec">
      <div class="card-head"><h2>辖区名册</h2><span class="tag" id="rosterTag">—</span></div>
      <div class="table-wrap">
        <table class="data">
          <thead><tr><th>老人</th><th>住址</th><th>风险</th><th>设备</th><th>今日用药</th><th>待处理</th><th>最近事件</th></tr></thead>
          <tbody id="rosterBody"></tbody>
        </table>
      </div>
    </section>

    <section class="card" style="margin-top:1rem" id="metricsSec">
      <div class="card-head"><h2>近 7 天指标</h2><span class="tag">真实数据</span></div>
      <div class="cols">
        <div>
          <p class="small muted" style="margin-bottom:.5rem">工单来源</p>
          <ul class="bars" id="barSource"></ul>
        </div>
        <div>
          <div class="stat-grid" style="grid-template-columns:repeat(2,1fr)">
            <div class="stat"><b id="mAvg">—</b><span>平均接单用时</span></div>
            <div class="stat"><b id="mCount">—</b><span>7 天工单</span></div>
            <div class="stat"><b id="mRate">—</b><span>设备在线率</span></div>
            <div class="stat"><b id="mElders">—</b><span>在册老人</span></div>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>

<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>
<script src="/assets/api.js"></script>
<script src="/assets/console.js"></script>
</body>
</html>
