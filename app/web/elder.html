<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安语 · 我的助手</title>
<meta name="theme-color" content="#FBF8F2">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="安语">
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>

<svg class="icon-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="10" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 9v4"/><circle cx="12" cy="16.5" r=".9" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pill" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="9" width="18" height="6" rx="3"/><path d="M12 9v6"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6.5 3h3L11 7.5 9 9a12 12 0 0 0 6 6l1.5-2 4.5 1.5v3a2 2 0 0 1-2 2A15.5 15.5 0 0 1 4.5 5a2 2 0 0 1 2-2z"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7-4.35-7-9a4 4 0 0 1 7-2.65A4 4 0 0 1 19 11c0 4.65-7 9-7 9z"/></symbol>
  <symbol id="i-msg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-6l-4 3v-3H6a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-access" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="5" r="2"/><path d="M4 9h16"/><path d="M12 9v5"/><path d="M8 21l4-7 4 7"/></symbol>
</svg>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H12l-4.5 4v-4H6.5A2.5 2.5 0 0 1 4 13.5z"/><path d="M9 10.5h.01M12 10.5h.01M15 10.5h.01"/></svg>
      </span>
      <span class="brand-text"><strong>安语</strong><small>我的助手</small></span>
    </a>
    <span class="topbar-spacer"></span>
    <div class="topbar-actions">
      <div class="who"><b id="whoName">—</b><span id="whoRole">老人端</span></div>
      <button class="btn btn-ghost btn-sm" id="guardBtn" type="button" aria-pressed="false">守护聆听：关</button>
      <button class="icon-btn" id="bigBtn" type="button" aria-pressed="false" aria-label="放大字号">
        <svg aria-hidden="true"><use href="#i-access"/></svg>
      </button>
      <button class="btn btn-ghost btn-sm" type="button" data-logout>退出</button>
    </div>
  </div>
</header>

<main id="main" class="elder-main">
  <div class="wrap">
    <div class="greet">
      <div>
        <p class="meta" id="dateLine">—</p>
        <h1 id="greetLine">您好</h1>
      </div>
      <div class="clock" id="clockLine">--:--</div>
    </div>

    <div class="elder-grid" style="margin-top:1rem">
      <!-- 左：对话 -->
      <div>
        <section class="card talk-card" aria-labelledby="talkTitle">
          <button class="orb" id="talkBtn" type="button" aria-label="点一下开始说话">
            <svg aria-hidden="true"><use href="#i-mic"/></svg>
          </button>
          <p class="talk-hint" id="talkTitle">点一下，跟我说话</p>
          <p class="talk-sub" id="talkHint">说「我吃过了」「血压 135 85」「打给女儿」都行</p>

          <form class="say-form" id="sayForm">
            <label class="sr-only" for="sayInput">也可以在这里打字</label>
            <input id="sayInput" type="text" autocomplete="off" placeholder="也可以在这里打字">
            <button class="btn btn-primary" type="submit">发送</button>
          </form>
          <p class="live" id="live" aria-live="polite"></p>
          <p class="guard-pill" id="guardPill" hidden>
            <span class="dot"></span>守护中 · 听到「救命」「摔倒了」会自动报警
          </p>
        </section>

        <section class="card" aria-labelledby="chatTitle">
          <div class="card-head">
            <h2 id="chatTitle">刚才说的话</h2>
            <span class="tag" id="aiTag" hidden>—</span>
          </div>
          <div class="chat-log" id="chatLog" aria-live="polite">
            <p class="muted small">还没有对话。点上面的圆钮，或者直接打字。</p>
          </div>
        </section>

        <section class="card">
          <div class="card-head"><h2>量个血压</h2><span class="tag">会告诉家人</span></div>
          <form id="vitalForm" class="row-3">
            <div class="field" style="margin:0"><label for="vSys">高压</label><input id="vSys" type="number" inputmode="numeric" min="60" max="260" placeholder="135"></div>
            <div class="field" style="margin:0"><label for="vDia">低压</label><input id="vDia" type="number" inputmode="numeric" min="30" max="200" placeholder="85"></div>
            <div class="field" style="margin:0"><label for="vPulse">脉搏</label><input id="vPulse" type="number" inputmode="numeric" min="30" max="200" placeholder="74"></div>
            <button class="btn btn-primary" type="submit" style="grid-column:1/-1">记下来</button>
          </form>
          <p class="small muted" id="vitalLast" style="margin-top:.5rem"></p>
          <div id="vitalTrend" style="margin-top:.6rem"></div>
        </section>
      </div>

      <!-- 右：SOS / 用药 / 留言 -->
      <div>
        <section class="card" id="callCard" hidden>
          <div class="card-head"><h2>找家人</h2><span class="tag" id="callRelation">家属</span></div>
          <a class="btn btn-primary btn-lg btn-block" id="callBtn" href="#" style="text-decoration:none">
            给 <span id="callName">家人</span> 打电话
          </a>
          <p class="small muted" style="margin-top:.5rem">手机上点一下就直接拨号；电脑上会提示号码。</p>
        </section>

        <section class="card sos-card">
          <button class="sos-btn" id="sosBtn" type="button">
            <svg class="ico" aria-hidden="true"><use href="#i-alert"/></svg>
            <span><b>紧急求助</b><small>按一下，3 秒后通知家人和社区</small></span>
          </button>
        </section>

        <section class="card" aria-labelledby="medTitle">
          <div class="card-head">
            <h2 id="medTitle">今天的药</h2>
            <span class="tag" id="medProgress">0 / 0</span>
          </div>
          <div id="medList"></div>
          <p class="small muted" id="medNote" style="margin-top:.6rem">点「吃了」才算数；过点没确认会通知家属。</p>
        </section>

        <section class="card" aria-labelledby="msgTitle">
          <div class="card-head">
            <h2 id="msgTitle">家人留言</h2>
            <button class="btn btn-ghost btn-sm" type="button" id="speakMsg">读给我听</button>
          </div>
          <div id="msgList"></div>
        </section>

      </div>
    </div>
  </div>
</main>

<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>
<script src="/assets/api.js"></script>
<script src="/assets/elder.js"></script>
</body>
</html>
